name: Traer assets desde Netlify (una sola vez)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar y verificar assets
        run: |
          python3 - <<'PY'
          import os, hashlib, urllib.request, time
          base = "https://aventura-barcelona.netlify.app"
          ok = 0
          for line in open("migracion/assets.tsv", encoding="utf-8"):
              line = line.rstrip("\n")
              if not line: continue
              tgt, src, sha = line.split("\t")
              for i in range(4):
                  try:
                      data = urllib.request.urlopen(base + src, timeout=60).read(); break
                  except Exception as e:
                      print("reintento", src, e); time.sleep(3)
              else:
                  raise SystemExit("FALLO descarga " + src)
              h = hashlib.sha256(data).hexdigest()
              if h != sha: raise SystemExit("FALLO checksum " + tgt)
              os.makedirs(os.path.dirname(tgt), exist_ok=True)
              open(tgt, "wb").write(data); ok += 1
          print("OK", ok, "archivos verificados")
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Assets del deploy Netlify 6af8373596721afec4baa8b0 (sha256 verificado)"
          git push
